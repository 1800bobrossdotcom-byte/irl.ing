            <div class="loop-head"><span class="handle">@jules</span><span class="more" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2.2" /><circle cx="12" cy="12" r="2.2" /><circle cx="19" cy="12" r="2.2" /></svg></span></div>
            <div class="frame" role="img" aria-label="@jules’s loop" data-handle="@jules"></div>
          </li>
          <li class="loop" data-clip="3">
            <div class="loop-head"><span class="handle">@sam</span><span class="more" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2.2" /><circle cx="12" cy="12" r="2.2" /><circle cx="19" cy="12" r="2.2" /></svg></span></div>

          </li>

            <div class="frame" role="img" aria-label="@noor’s loop" data-handle="@noor"></div>
          </li>
        </ul>
        <p class="end">You’re caught up<span class="dot">.</span></p>
