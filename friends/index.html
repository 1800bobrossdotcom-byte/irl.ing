<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Six-second loops from your friends. Then you’re caught up." />
    <title>irl.ing — friends</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/social/social.css" />
    <script type="module" src="/src/social/friends-page.js"></script>
  </head>
  <body>
    <header class="top">
      <a class="wordmark" href="/" aria-label="irl.ing home"
        ><svg viewBox="0 0 442.24 196" aria-hidden="true">
          <path d="M14.5 142V42M54.5 142V42M125.74 142V0M204.74 142V42M244.74 142V42M244.74 86A34 34 0 0 1 312.74 86M312.74 86V142M347.74 92a40 40 0 1 0 80 0a40 40 0 1 0 -80 0M427.74 42V144" fill="none" stroke="currentColor" stroke-width="24" />
          <path d="M54.5 82A30 30 0 0 1 95.74 54.18M427.74 144A40 40 0 0 1 354.58 166.37" fill="none" stroke="currentColor" stroke-width="24" stroke-linecap="round" />
          <circle cx="14.5" cy="14.5" r="14.5" fill="currentColor" />
          <circle cx="204.74" cy="14.5" r="14.5" fill="currentColor" />
          <circle class="rec" cx="165.24" cy="127.5" r="14.5" /></svg
      ></a>
      <div class="me" id="me" hidden>
        <span id="me-handle"></span>
        <a class="rec-link" href="/loops/" aria-label="Make a loop"><i></i></a>
      </div>
    </header>

    <main class="page" id="main">
      <p class="loading" id="boot" role="status">Loading…</p>

      <section class="hello" id="signed-out" hidden aria-labelledby="hello-title">
        <h1 id="hello-title">Loops from your friends<span class="dot">.</span></h1>
        <button class="btn primary" id="sign-in" type="button">Sign in</button>
        <p class="error" id="sign-in-error" role="alert"></p>
        <p class="switch">New here? <a href="/loops/">Make your @name</a></p>
      </section>

      <div id="app" hidden>
        <h1 class="sr">Your friends on irl.ing</h1>
        <div class="notice" id="invite-notice" hidden></div>
        <nav class="tabs" aria-label="Sections">
          <a href="#feed">Feed</a>
          <a href="#mine">Your loops</a>
          <a href="#friends">Friends<span class="badge" id="badge" hidden></span></a>
        </nav>
        <section class="panel" id="feed-panel" aria-label="Feed"></section>
        <section class="panel" id="mine-panel" aria-label="Your loops" hidden></section>
        <section class="panel" id="friends-panel" aria-label="Friends" hidden></section>
      </div>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
