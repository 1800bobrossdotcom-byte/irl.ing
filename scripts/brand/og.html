<!doctype html>
<!-- Template for public/brand/og.png (1200×630), rendered by build.mjs --png. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Schibsted Grotesk";
        src: url(../../public/fonts/schibsted-grotesk-latin.woff2) format("woff2");
        font-weight: 400 900;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #111110;
        color: #f4f4f0;
        font-family: "Schibsted Grotesk", system-ui, sans-serif;
      }
      #lockup svg {
        position: absolute;
        left: 72px;
        top: 64px;
        height: 62px;
        width: auto;
      }
      #mark svg {
        position: absolute;
        width: 600px;
        height: 600px;
        right: -230px;
        top: 15px;
      }
      h1 {
        position: absolute;
        left: 68px;
        bottom: 118px;
        margin: 0;
        font-size: 100px;
        line-height: 0.9;
        font-weight: 860;
        letter-spacing: -0.045em;
      }
      h1 span {
        display: block;
        color: #f33a16;
      }
      p {
        position: absolute;
        left: 72px;
        bottom: 60px;
        margin: 0;
        font-size: 24px;
        font-weight: 500;
        color: #a8a8a0;
        letter-spacing: -0.01em;
      }
      .bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 12px;
        display: flex;
        gap: 10px;
      }
      .bar i {
        background: #d8f04a;
      }
    </style>
  </head>
  <body>
    <div id="lockup"></div>
    <div id="mark"></div>
    <h1>Less scrolling.<span>More irl’ing.</span></h1>
    <p>Six-second social video. Hold to record, let go to pause. Android first.</p>
    <div class="bar"><i style="flex: 2.6"></i><i style="flex: 1.5"></i><i style="flex: 1.9"></i></div>
  </body>
</html>
