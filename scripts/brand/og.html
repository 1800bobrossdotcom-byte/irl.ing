<!doctype html>
<!-- Template for public/brand/og.png (1200×630), rendered by build.mjs --png.
     One lockup, one line, daylight white. Sized to read at chat-thumbnail
     width (about 300 px), and the lockup survives a centered square crop. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Schibsted Grotesk";
        src: url(../../public/fonts/schibsted-grotesk-latin.woff2) format("woff2");
        font-weight: 400 900;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #ffffff;
        color: #111110;
        font-family: "Schibsted Grotesk", system-ui, sans-serif;
      }
      body {
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 54px;
      }
      #lockup svg {
        display: block;
        height: 190px;
        width: auto;
      }
      p {
        margin: 0;
        font-size: 64px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.04em;
      }
      p span {
        color: #f33a16;
      }
    </style>
  </head>
  <body>
    <div id="lockup"></div>
    <p>Less scrolling. <span>More irl’ing.</span></p>
  </body>
</html>
